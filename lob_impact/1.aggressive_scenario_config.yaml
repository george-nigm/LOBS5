# Aggressive Scenario Configuration
# Run: python lob_impact/1.aggressive_scenario_s5_rnd.py --config lob_impact/1.aggressive_scenario_config.yaml

# Scenario parameters
n_gen_msgs: 50          # messages to generate between insertions/coolings
num_insertions: 20       # number of aggressive order insertions
num_coolings: 100        # number of cooling periods (generation without insertion)
n_cond_msgs: 500        # conditioning messages
n_eval_msgs_dataset: 500  # for dataset loading (match run_inference.py for identical samples)

# Aggressive order parameters
event_type: 4           # 4 = market order (execution)
direction: 0            # 0 = buy (hit ask), 1 = sell (hit bid)
order_volume: 75        # order size (mean market order in data)
use_relative_volume: false
order_volume_ratio: 1.0

# Model checkpoint parameters (for run_inference.py compatibility)
checkpoint_step: null   # null = latest checkpoint, or specify step number (e.g. 23)
chunk_size: 5           # N for chunking conditional sequence (like --chunk_size 5)

# Sampling
n_samples: 2048           # total number of samples to generate
batch_size: 64           # samples per batch (vmap parallelism on single GPU)
rng_seed: 42            # fixed seed for reproducibility

# Model/Data paths
stock: "GOOG"
data_dir: "/home/myuser/data/processed_data/GOOG/2023_Jan"
ckpt_path: "/home/myuser/data/checkpoints/lobs5_v2/twilight-sound-77_s42sujip"
save_dir: "/home/myuser/data/evalsequences/aggressive_scenario"

# Model parameters
tick_size: 100
sample_top_n: -1        # -1 = sample from full distribution
n_vol_series: 500
book_dim: 503
# test_split: 0.1
test_split: 0           # 0 = use all data (like --test_split 0 in run_inference.py)