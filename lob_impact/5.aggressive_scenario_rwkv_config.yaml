# RWKV Aggressive Scenario Configuration
# Run: python lob_impact/5.aggressive_scenario_rwkv.py --config lob_impact/5.aggressive_scenario_rwkv_config.yaml

# RWKV Model
lobgen_dir: "/app/lobgen"
model_choice: "7g0.1B"
rwkv_type: "ScanRWKV"
ckpt_path: "/home/myuser/data/checkpoints/rwkv_models/bptt_rwkv_7g0.1B/10"
tokenizer_file: "tokenizers/lob_tok.json"   # relative to lobgen_dir
temperature: 1.0

# Data
raw_data_dir: "/home/myuser/data/rawLOBSTER/GOOG/JAN2023"
stock: "GOOG"
tick_size: 100

# Sequence
n_cond_msgs: 500
n_gen_msgs: 5
max_tokens_per_block: 2000    # upper bound tokens for n_gen_msgs messages (~30 tok/msg x 50 x 1.3 margin)

# Insertions
num_insertions: 3
num_coolings: 9
event_type: 4
direction: 0
order_volume: 75

# Sampling / Batching
n_samples: 2048
batch_size: 64
rng_seed: 42
n_levels: 10

# RWKV processing
process_long_seq_padding: 128
max_cond_tokens: 15000

# Output
save_dir: "/home/myuser/data/evalsequences/rwkv_aggressive_scenario"
