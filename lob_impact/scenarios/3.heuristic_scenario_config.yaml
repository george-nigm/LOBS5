# Heuristic Scenario Configuration
# Run: python lob_impact/3.heuristic_scenario.py --config lob_impact/3.heuristic_scenario_config.yaml
# Replays historical messages + injects aggressive orders + price shifting on consumed levels.

# Data
data_dir: "/home/myuser/data/processed_data/GOOG/2023_Jan"
stock: "GOOG"
tick_size: 100

# Sequence
n_cond_msgs: 500
n_gen_msgs: 5          # historical msgs between insertions
n_eval_msgs_dataset: 500  # for dataset loading (match run_inference.py)

# Insertions
num_insertions: 5
num_coolings: 50
event_type: 4            # 4 = market order
direction: 0             # 0 = buy (hit ask), 1 = sell (hit bid)
order_volume: 75        # absolute volume

# Sampling
n_samples: 2048
batch_size: 64
rng_seed: 42
test_split: 0

# Book
n_vol_series: 500
book_dim: 503

# Output
save_dir: "/home/myuser/data/evalsequences/heuristic_scenario"
